name: mof-screening
channels:
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.10.12

  # Core ML
  - xgboost=1.7.6
  - lightgbm=3.3.5
  - scikit-learn=1.3.0
  - optuna=3.3.0

  # Data
  - pandas=1.5.3
  - numpy=1.24.3
  - pyarrow=12.0.1       # for .parquet read/write

  # Chemistry
  - rdkit=2023.03.3
  - pymatgen=2023.8.10

  # Interpretability
  - shap=0.42.1

  # Visualisation
  - matplotlib=3.7.2
  - seaborn=0.12.2

  # Utilities
  - tqdm=4.65.0
  - joblib=1.3.1
  - scipy=1.11.1

  # pip-only packages
  - pip
  - pip:
      - zeoplusplus==0.0.4   # Zeo++ Python bindings (geometric features)

# To create the environment:
#   conda env create -f environment.yml
#
# To activate:
#   conda activate mof-screening
#
# To export your current environment (for reproducibility check):
#   conda env export > environment_full.yml
