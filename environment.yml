name: mof-screening
channels:
  - conda-forge
  - defaults

dependencies:
  # Python
  - python>=3.12

  # Core ML
  - xgboost>=2.0
  - lightgbm>=4.0
  - scikit-learn>=1.3
  - optuna>=3.3

  # Data
  - pandas>=1.5
  - numpy>=1.24
  - pyarrow>=12.0       # for .parquet read/write

  # Chemistry
  - rdkit>=2023.03
  - pymatgen>=2023.8

  # Interpretability
  - shap>=0.42

  # Visualisation
  - matplotlib>=3.7
  - seaborn>=0.12

  # Utilities
  - tqdm>=4.65
  - joblib>=1.3
  - scipy>=1.11

  # pip-only packages
  - pip
  - pip:
      - zeoplusplus>=0.0.4   # Zeo++ Python bindings (geometric features)

# To create the environment:
#   conda env create -f environment.yml
#
# To activate:
#   conda activate mof-screening
#
# To export your current environment (for reproducibility check):
#   conda env export > environment_full.yml
#
# All scripts live at the repository root (no scripts/ subfolder) —
# see README.md "Repository structure".
